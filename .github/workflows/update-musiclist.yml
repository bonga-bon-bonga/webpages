name: update-musiclist

on:
    workflow_dispatch: {}       # 手動実行
    # schedule:
    #     - cron: "0 20 * * *"    # 毎日 05:00 JST に実行

permissions:
    contents: write

concurrency:
    group: update-json-from-sheets
    cancel-in-progress: false

jobs:
    update-json:
        runs-on: ubuntu-latest

        env:
            SPREAD_SHEET_ID: ${{ vars.SPREAD_SHEET_ID }}
            OUTPUT_JSON_PATH: ${{ vars.OUTPUT_JSON_PATH }}

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"
                cache: "pip"

          - name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

          - name: Run batch script
            run: |
                python scripts/build_musiclist.py

          - name: Validate generated JSON
            run: |
                test -f "$OUTPUT_JSON_PATH"
                python -m json.tool "$OUTPUT_JSON_PATH" > /dev/null

          - name: Commit and push if changed
            run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add "$OUTPUT_JSON_PATH"

                if git diff --cached --quiet; then
                    echo "No changes to commit."
                    exit 0
                fi

                git commit -m "[System] Update generated JSON from Google Sheets"
                git push