name: update-musiclist

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-json-from-sheets
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest

    env:
      SPREAD_SHEET_ID: ${{ vars.SPREAD_SHEET_ID }}
      OUTPUT_JSON_PATH: ${{ vars.OUTPUT_JSON_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s .github/workflows/requirements.txt ]; then
            pip install -r .github/workflows/requirements.txt
          fi

      - name: Check batch script syntax
        run: python -m py_compile scripts/build_musiclist.py

      - name: Run batch script
        run: python scripts/build_musiclist.py

      - name: Validate generated JSON
        run: |
          output_path="${OUTPUT_JSON_PATH:-nemupipiano-musiclist-search/data/musiclist.json}"
          test -f "$output_path"
          python -m json.tool "$output_path" > /dev/null

      - name: Commit and push if changed
        run: |
          output_path="${OUTPUT_JSON_PATH:-nemupipiano-musiclist-search/data/musiclist.json}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$output_path"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[System] Update generated JSON from Google Sheets"
          git push
