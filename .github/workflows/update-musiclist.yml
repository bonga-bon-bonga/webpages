name: update-musiclist

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-json-from-sheets
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest

    env:
      NEMUPIPIANO_SPREADSHEET_ID: ${{ vars.NEMUPIPIANO_SPREADSHEET_ID }}
      NEMUPIPIANO_GID_POPS: ${{ vars.NEMUPIPIANO_GID_POPS }}
      NEMUPIPIANO_GID_DISNEY: ${{ vars.NEMUPIPIANO_GID_DISNEY }}
      NEMUPIPIANO_GID_GHIBLI: ${{ vars.NEMUPIPIANO_GID_GHIBLI }}
      ALIAS_SPREADSHEET_ID: ${{ vars.ALIAS_SPREADSHEET_ID }}
      ALIAS_GID_ARTISTLIST: ${{ vars.ALIAS_GID_ARTISTLIST }}
      ALIAS_GID_MUSICLIST: ${{ vars.ALIAS_GID_MUSICLIST }}
      OUTPUT_JSON_PATH: ${{ vars.OUTPUT_JSON_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s .github/workflows/requirements.txt ]; then
            pip install -r .github/workflows/requirements.txt
          fi

      - name: Check batch script syntax
        run: |
          python -m py_compile scripts/sheet_hash.py
          python -m py_compile scripts/build_artist_alias.py
          python -m py_compile scripts/build_music_alias.py
          python -m py_compile scripts/build_musiclist.py
          python -m py_compile scripts/enrich_musiclist.py

      - name: Build artist alias dictionary
        run: python scripts/build_artist_alias.py

      - name: Build music alias dictionary
        run: python scripts/build_music_alias.py

      - name: Build music list
        run: python scripts/build_musiclist.py

      - name: Enrich search metadata
        run: |
            python scripts/enrich_musiclist.py

      - name: Validate generated JSON
        run: |
          output_path="${OUTPUT_JSON_PATH:-nemupipiano-musiclist-search/data/musiclist.json}"
          artist_alias_path="${ARTIST_ALIAS_DICTIONARY_PATH:-nemupipiano-musiclist-search/data/dictionary/artist_alias_dictionary.json}"
          music_alias_path="${MUSIC_ALIAS_DICTIONARY_PATH:-nemupipiano-musiclist-search/data/dictionary/music_alias_dictionary.json}"
          artist_alias_hash_path="${ARTIST_ALIAS_HASH_PATH:-nemupipiano-musiclist-search/data/hash/artist_alias_dictionary}"
          music_alias_hash_path="${MUSIC_ALIAS_HASH_PATH:-nemupipiano-musiclist-search/data/hash/music_alias_dictionary}"
          musiclist_hash_path="${MUSICLIST_HASH_PATH:-nemupipiano-musiclist-search/data/hash/musiclist}"
          test -f "$artist_alias_path"
          test -f "$music_alias_path"
          test -f "$output_path"
          test -s "$artist_alias_hash_path"
          test -s "$music_alias_hash_path"
          test -s "$musiclist_hash_path"
          python -m json.tool "$artist_alias_path" > /dev/null
          python -m json.tool "$music_alias_path" > /dev/null
          python -m json.tool "$output_path" > /dev/null
          grep -Eq '^[0-9a-f]{64}$' "$artist_alias_hash_path"
          grep -Eq '^[0-9a-f]{64}$' "$music_alias_hash_path"
          grep -Eq '^[0-9a-f]{64}$' "$musiclist_hash_path"

      - name: Commit and push if changed
        run: |
          output_path="${OUTPUT_JSON_PATH:-nemupipiano-musiclist-search/data/musiclist.json}"
          artist_alias_path="${ARTIST_ALIAS_DICTIONARY_PATH:-nemupipiano-musiclist-search/data/dictionary/artist_alias_dictionary.json}"
          music_alias_path="${MUSIC_ALIAS_DICTIONARY_PATH:-nemupipiano-musiclist-search/data/dictionary/music_alias_dictionary.json}"
          artist_alias_hash_path="${ARTIST_ALIAS_HASH_PATH:-nemupipiano-musiclist-search/data/hash/artist_alias_dictionary}"
          music_alias_hash_path="${MUSIC_ALIAS_HASH_PATH:-nemupipiano-musiclist-search/data/hash/music_alias_dictionary}"
          musiclist_hash_path="${MUSICLIST_HASH_PATH:-nemupipiano-musiclist-search/data/hash/musiclist}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$artist_alias_path"
          git add "$music_alias_path"
          git add "$output_path"
          git add "$artist_alias_hash_path"
          git add "$music_alias_hash_path"
          git add "$musiclist_hash_path"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[System] Update generated JSON from Google Sheets"
          git push
